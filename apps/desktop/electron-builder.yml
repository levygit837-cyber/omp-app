appId: dev.omp-app.desktop
productName: omp-app
directories:
  output: dist
files:
  - out/**
  - package.json
# The compiled sidecar lands in Contents/Resources/, next to the app's own resources.
extraResources:
  - from: ../../packages/sidecar/dist/omp-app-sidecar
    to: omp-app-sidecar
mac:
  target:
    - dir
  identity: null
