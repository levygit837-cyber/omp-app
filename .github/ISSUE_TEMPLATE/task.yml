name: Task
description: Scoped implementation work that is already decided, ready for an agent or a person to execute.
title: "task: "
labels: ["needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now, parent issue or spec, and ADRs that constrain the solution.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What to change
      description: Files, symbols, and contracts touched. Point to `file:line` for omp code.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable items, including the command or test that proves each one.
      placeholder: |
        - [ ] `command` returns ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: nongoals
    attributes:
      label: Out of scope
      description: What must not be touched.
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: Blocked by
      description: Issues that must close first (`#N`). Leave empty if none.
